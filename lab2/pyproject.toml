[project]
name = "neural-networks-architectures-lab2"
version = "1.0.0"
description = "Neural Network Architectures lab 2"
authors = [{name = "Jakub Adamczyk", email = "jadamczy@agh.edu.pl"}]
requires-python = "==3.12.*"

dependencies = [
    "accelerate>=1.1",
    "datasets>=4",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyter>=1.1.1",
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn>=1.6",
    "scipy",
    "sentence-transformers>=5.1",
    "tokenizers>=0.22",
    "torch>=2.8.0",
    "transformers>=5.5",
]

[dependency-groups]
dev = [
    # not exported to requirements.txt, it breaks Google Colab
    "ipywidgets",
    "notebook",
    "pre-commit",
    "ruff",
]
